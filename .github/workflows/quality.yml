# Quality gate. Jobs mirror scripts/run_checks.ps1 one for one and run in parallel so a
# failure names itself in the checks list. `siem` is the job that proves the compiled
# queries against a real Elasticsearch; everything else is static.

name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  types:
    name: types (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # The compiler module imports pySigma, so the `detection` extra is part of the
      # typing closure -- omitting it would fail the job, not degrade it.
      - run: pip install -e ".[dev,detection]"
      - run: mypy src

  unit:
    name: unit tests (no live SIEM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,detection]"
      # pyproject's addopts excludes the `siem` marker; those run in their own job.
      - run: pytest --cov=detection_lab --cov-report=term-missing

  catalog:
    name: catalog gate (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/validate_catalog.py --strict
      # The VM-validated gate must still FAIL: no Atomic run has happened. A green result
      # here would mean the boundary was erased, so the step inverts the exit code.
      - name: the VM-validated gate is still enforced
        run: |
          if python scripts/validate_catalog.py --require-validated; then
            echo "::error::--require-validated passed without VM evidence"; exit 1
          fi
      - run: python scripts/build_evidence_manifest.py --check

  compile-drift:
    name: compiled queries match rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,detection]"
      - run: python scripts/compile_rules.py --check

  status-drift:
    name: status SVG matches catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/render_status_svg.py --check

  siem:
    name: live SIEM (Elasticsearch 8.19.20)
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
        env:
          discovery.type: single-node
          # No auth in CI: the container is private to the job. The compose lab keeps
          # basic auth on so the local path matches a real deployment more closely.
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DETECTION_LAB_ES_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,detection]"
      - run: python scripts/wait_for_es.py --timeout 180
      - run: pytest -m siem -v

  gitleaks:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # The action wrapper fails on any git stderr output (CRLF warnings included);
      # the pinned binary scans the same history without that trap.
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --verbose
